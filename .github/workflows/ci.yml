# CI de TicketFlow (H-08 AC3, D-0020): invoca el MISMO gate que corre el dueño
# localmente (scripts/ci.ps1) — cero deriva. Corre en ubuntu-latest (GitHub Actions):
# el preflight buildea el emulador AWS con el Docker del job, extrae creds/CA de esa
# corrida y ejecuta preflight -> build (0 warnings) -> suite completa contra el
# emulador del job (umbral >=70% Core) -> infra-verify -> workflow-lint.
# La etapa -Demos es solo local (Windows). Solo master: los tags viejos llevan
# codigo pre-portabilidad y no tienen que gatear.
name: ci
on:
  push:
    branches: [master]
  pull_request:
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.x'
      - name: Gate local (el mismo script que corre el dueño)
        shell: pwsh
        run: pwsh -File scripts/ci.ps1
